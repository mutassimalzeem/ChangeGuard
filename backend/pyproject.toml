[project]
name = "changeguard"
version = "0.1.0"
description = "ChangeGuard - Construction Change Order Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.8.2",
    "email-validator>=2.1.0",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.3",

    # Background Jobs
    "celery>=5.3.6",
    "redis>=5.0.1",

    # Object Storage
    "boto3>=1.34.0",
    "minio>=7.2.0",

    # Document Processing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pillow>=10.2.0",
    "pdfplumber>=0.11.0",
    "unstructured>=0.14.0",

    # AI/ML
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "instructor>=1.2.0",
    "langchain-core>=0.1.45",
    "langchain-openai>=0.1.12",
    "langchain-anthropic>=0.1.12",
    "tiktoken>=0.6.0",

    # Search & Retrieval
    "rank-bm25>=0.2.2",

    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-redis>=0.42b0",
    "opentelemetry-instrumentation-celery>=0.42b0",

    # Validation & Utilities
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "pydash>=0.0.2",
    "orjson>=3.9.10",
    "msgspec>=0.18.0",

    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "faker>=25.1.0",
    "factory-boy>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
    "ipdb>=0.13.13",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.1",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH", "PD", "PG", "PL", "TRY", "SIM", "RUF", "RET"]
ignore = ["S101", "S106", "S311", "S603", "S607"]
per-file-ignores = {
    "tests/*" = ["S101", "S106", "S311"],
    "alembic/*" = ["S101", "E402"],
}
exclude = [".venv", "dist", "build", "*.egg-info", ".mypy_cache", ".ruff_cache", "node_modules", "frontend/node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = false
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "frontend/node_modules",
    "alembic",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "ai: Tests requiring AI models",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]