name: ChangeGuard CI Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - '7.*'
  pull_request:
    branches:
      - main
      - 'release/**'
      - '7.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run backend Ruff lint check
        run: ruff check backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend ESLint check
        working-directory: frontend
        run: npm run lint

  typecheck:
    name: Type Check (Mypy & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy

      - name: Run backend Mypy type check
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend TypeScript type check
        working-directory: frontend
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/changeguard
        run: |
          pytest backend/tests/test_production_readiness.py backend/tests/test_golden_dataset.py backend/tests/test_evaluation_harness.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: changeguard_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/changeguard_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run backend integration tests
        env:
          PYTHONPATH: backend
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/changeguard_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/test_projects.py backend/tests/test_authorization.py -v

  golden-evaluation:
    name: Golden Dataset Evaluation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ChangeGuard Golden Evaluation Suites
        env:
          PYTHONPATH: backend
        run: |
          python -m app.evaluation.run --suite all --ci

      - name: Upload Evaluation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-evaluation-reports
          path: tests/golden/reports/
          retention-days: 14

  security-tests:
    name: Security & Red-Team Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Red-Team Security Test Suites
        env:
          PYTHONPATH: backend
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/changeguard
        run: |
          pytest backend/tests/red_team/ -v

  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: changeguard-backend:ci-test

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: changeguard-frontend:ci-test
