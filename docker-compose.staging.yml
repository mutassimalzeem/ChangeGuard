version: "3.8"

# ==============================================================================
# ChangeGuard - Staging Environment Docker Compose
#
# Production-identical orchestration configured for pilot staging deployment.
# Enforces non-root execution, explicit resource limits, dependency healthchecks,
# and graceful shutdown handling.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: changeguard-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-changeguard}
    ports:
      - "5432:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changeguard} -d ${POSTGRES_DB:-changeguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # Redis 7 Cache & Celery Message Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: changeguard-staging-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-staging_redis_pass_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: changeguard-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-changeguard_staging_minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-staging_minio_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # ChangeGuard FastAPI Application Server
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changeguard-staging-api
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-changeguard}:${POSTGRES_PASSWORD:-staging_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-changeguard}
      REDIS_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/2
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-changeguard_staging_minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-staging_minio_pass_2026}
      OBJECT_STORAGE_BUCKET: changeguard
      OBJECT_STORAGE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-staging_super_secret_jwt_key_32_characters_minimum}
      SENTRY_DSN: ${SENTRY_DSN:-}
      REQUEST_TIMEOUT_SECONDS: "60"
      CELERY_WORKER_CONCURRENCY: "4"
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "30"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # ChangeGuard Celery Async Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changeguard-staging-worker
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-changeguard}:${POSTGRES_PASSWORD:-staging_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-changeguard}
      REDIS_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/2
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-changeguard_staging_minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-staging_minio_pass_2026}
      OBJECT_STORAGE_BUCKET: changeguard
      OBJECT_STORAGE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-staging_super_secret_jwt_key_32_characters_minimum}
      SENTRY_DSN: ${SENTRY_DSN:-}
      REQUEST_TIMEOUT_SECONDS: "60"
      CELERY_WORKER_CONCURRENCY: "4"
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -m app.core.worker_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: [
      "celery",
      "-A", "app.core.celery_app",
      "worker",
      "--loglevel=info",
      "--concurrency=4",
      "-Q", "celery,ingestion,document_processing,ai,workflow"
    ]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # ChangeGuard Celery Periodic Scheduler (Beat)
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changeguard-staging-beat
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-changeguard}:${POSTGRES_PASSWORD:-staging_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-changeguard}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-staging_redis_pass_2026}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - staging_net

  # ----------------------------------------------------------------------------
  # ChangeGuard Next.js Web Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: changeguard-staging-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - staging_net

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_minio_data:

networks:
  staging_net:
    driver: bridge
